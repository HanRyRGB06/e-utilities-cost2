version: '3.8'

services:
  # 1. MariaDB Database
  mariadb:
    image: mariadb:11
    container_name: e-utilities-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - e-utilities-network

  # 2. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: e-utilities-phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - e-utilities-network

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: e-utilities-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    networks:
      - e-utilities-network

  # 4. Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: e-utilities-backend
    image: e-utilities-cost-backend:latest
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:8080
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - e-utilities-network
    restart: unless-stopped

  # 5. Frontend Vue App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: e-utilities-frontend
    image: e-utilities-cost-frontend:latest
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - e-utilities-network
    restart: unless-stopped

  # 6. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: e-utilities-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - e-utilities-network
    restart: unless-stopped

volumes:
  mariadb_data:
  redis_data:

networks:
  e-utilities-network:
    driver: bridge
